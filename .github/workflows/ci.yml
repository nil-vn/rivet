name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  quality:
    name: Rust quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.97.1 --profile minimal --component clippy,rustfmt
      - name: Format
        run: cargo +1.97.1 fmt --all --check
      - name: Check minimal profile
        run: cargo +1.97.1 check --locked --no-default-features --workspace --all-targets
      - name: Check default profile
        run: cargo +1.97.1 check --locked --workspace --all-targets
      - name: Clippy
        run: cargo +1.97.1 clippy --locked --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo +1.97.1 test --locked --workspace
      - name: Documentation policy
        run: ./scripts/check-docs.sh

  feature-profiles:
    name: Feature profile (${{ matrix.features }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        features:
          - flight-sql
          - s3
          - wasm
          - python
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.97.1 --profile minimal
      - name: Compile feature profile
        run: cargo +1.97.1 check --locked --features "${{ matrix.features }}"
